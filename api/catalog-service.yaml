openapi: 3.0.3
info:
  title: catalog-service
  version: 1.0.0
  description: Карточки игр и действующие суточные тарифы.
servers:
  - url: https://gateway.board-rental.example
    description: Внешний API через Spring Cloud Gateway
security:
  - userToken: []
tags:
  - name: public
    description: Клиентские операции через API Gateway.
  - name: internal
    description: Вызовы работника саги в приватной сети.
paths:
  /api/v1/games:
    get:
      tags:
        - public
      operationId: listGames
      summary: Показать каталог
      description: Активные игры сортируются по названию и gameId. Пустая страница возвращается с пустым items.
      parameters:
        - name: page
          in: query
          description: Номер страницы с нуля.
          required: false
          schema:
            type: integer
            minimum: 0
            description: Номер страницы
            default: 0
          example: 0
        - name: size
          in: query
          description: Размер страницы.
          required: false
          schema:
            type: integer
            minimum: 1
            description: Размер страницы
            maximum: 100
            default: 20
          example: 20
      responses:
        "200":
          description: Страница игр
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GamePage"
              example:
                page: 0
                size: 20
                totalElements: 1
                items:
                  - gameId: e9dc293a-c426-44bb-99fb-97b57a406138
                    name: Каркассон
                    minPlayers: 2
                    maxPlayers: 5
                    tariffVersion: 4
                    dailyPriceKopecks: 35000
                    currency: RUB
        "400": &a1
          description: Некорректный запрос
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://problem.board-rental.example/validation-error
                title: Некорректный запрос
                status: 400
                code: VALIDATION_ERROR
                detail: Проверьте параметры и обязательные поля.
                traceId: b16c97c0001d4b3a874d357dfe714c03
        "401": &a2
          description: Требуется токен
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://problem.board-rental.example/unauthenticated
                title: Требуется токен
                status: 401
                code: UNAUTHENTICATED
                detail: Предъявите действительный JWT.
                traceId: b16c97c0001d4b3a874d357dfe714c03
        "403": &a3
          description: Доступ запрещён
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://problem.board-rental.example/access-denied
                title: Доступ запрещён
                status: 403
                code: ACCESS_DENIED
                detail: Токен не даёт права на выполнение операции.
                traceId: b16c97c0001d4b3a874d357dfe714c03
        "429":
          description: Превышен лимит запросов
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://problem.board-rental.example/rate-limited
                title: Превышен лимит запросов
                status: 429
                code: RATE_LIMITED
                detail: Повторите запрос позже.
                traceId: b16c97c0001d4b3a874d357dfe714c03
        "503": &a4
          description: Сервис временно недоступен
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://problem.board-rental.example/service-unavailable
                title: Сервис временно недоступен
                status: 503
                code: SERVICE_UNAVAILABLE
                detail: Повторите запрос позже.
                traceId: b16c97c0001d4b3a874d357dfe714c03
  /internal/v1/games/{gameId}/tariff:
    get:
      tags:
        - internal
      operationId: getActiveTariff
      summary: Получить действующий тариф
      description: Версия и цена читаются из PostgreSQL. Координатор сохраняет полученные значения в снимке тарифа.
      parameters:
        - name: gameId
          in: path
          description: Идентификатор игры
          required: true
          schema:
            type: string
            description: Идентификатор игры
            format: uuid
          example: e9dc293a-c426-44bb-99fb-97b57a406138
      responses:
        "200":
          description: Текущий тариф
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameTariff"
              example:
                gameId: e9dc293a-c426-44bb-99fb-97b57a406138
                tariffVersion: 4
                dailyPriceKopecks: 35000
                currency: RUB
        "400": *a1
        "401": *a2
        "403": *a3
        "404":
          description: Игра недоступна
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: https://problem.board-rental.example/game-unavailable
                title: Игра недоступна
                status: 404
                code: GAME_UNAVAILABLE
                detail: Действующий тариф для игры не найден.
                traceId: b16c97c0001d4b3a874d357dfe714c03
        "503": *a4
      servers:
        - url: https://catalog-service.board-rental.internal
          description: Внутренняя сеть сервисов
      security:
        - serviceToken: []
components:
  securitySchemes:
    userToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC-токен пользователя Keycloak.
    serviceToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Токен client credentials с областью booking:orchestrate.
  schemas:
    Problem:
      type: object
      required:
        - type
        - title
        - status
        - code
        - detail
        - traceId
      additionalProperties: false
      properties:
        type:
          type: string
          description: URI категории ошибки
          format: uri
        title:
          type: string
          description: Короткое описание причины
        status:
          type: integer
          minimum: 400
          description: Код HTTP
          maximum: 599
        code:
          type: string
          description: Стабильный код для клиента
          pattern: ^[A-Z][A-Z0-9_]*$
        detail:
          type: string
          description: Описание ошибки в данном запросе
        traceId:
          type: string
          description: Идентификатор трассировки
          pattern: ^[0-9a-f]{32}$
    Game:
      type: object
      required:
        - gameId
        - name
        - minPlayers
        - maxPlayers
        - tariffVersion
        - dailyPriceKopecks
        - currency
      additionalProperties: false
      properties:
        gameId:
          type: string
          description: Идентификатор игры
          format: uuid
        name:
          type: string
          description: Название игры
        minPlayers:
          type: integer
          minimum: 1
          description: Минимальное число игроков
        maxPlayers:
          type: integer
          minimum: 1
          description: Максимальное число игроков
        tariffVersion: &a5
          type: integer
          minimum: 1
          description: Версия действующего тарифа
        dailyPriceKopecks: &a6
          type: integer
          minimum: 0
          description: Суточный тариф в копейках
          format: int64
        currency: &a7
          type: string
          description: Код валюты
          enum:
            - RUB
    GameTariff:
      type: object
      required:
        - gameId
        - tariffVersion
        - dailyPriceKopecks
        - currency
      additionalProperties: false
      properties:
        gameId:
          type: string
          description: Идентификатор игры
          format: uuid
        tariffVersion: *a5
        dailyPriceKopecks: *a6
        currency: *a7
    GamePage:
      type: object
      required:
        - page
        - size
        - totalElements
        - items
      additionalProperties: false
      properties:
        page:
          type: integer
          minimum: 0
          description: Номер страницы
        size:
          type: integer
          minimum: 1
          description: Размер страницы
          maximum: 100
        totalElements:
          type: integer
          minimum: 0
          description: Количество результатов
          format: int64
        items:
          type: array
          items:
            $ref: "#/components/schemas/Game"
          description: Карточки игр
